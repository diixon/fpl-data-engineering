# I use YAML anchors (x-airflow-common) to define the base configuration once,
# instead of repeating the same environment variables and volumes for the
# webserver, scheduler, and init containers.
#
# Credentials now come from my .env file (see .env.example) instead of being
# typed here, so the password lives in ONE place. "${VAR:?message}" means:
# stop with this message if the variable is missing, instead of silently
# starting with an empty password.
x-airflow-common: &airflow-common
  # I build a custom image from my Dockerfile, instead of using the public
  # apache/airflow image directly. This ensures my Python dependencies are
  # installed inside the container.
  build: .
  image: fpl-airflow-custom:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # I explicitly set a SECRET_KEY for the webserver.
    # Why: Without this, the webserver cannot read logs generated by the scheduler,
    # resulting in a 403 FORBIDDEN error when I try to view task logs in the UI.
    # The default below is for local development only - change it in .env for anything shared.
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-only-change-me}
    # My DAG does "from src...." - Python can only find the src/ folder if its
    # parent (/opt/airflow) is on the import path. Airflow adds dags/ and plugins/
    # automatically, but NOT /opt/airflow itself, so I add it here.
    PYTHONPATH: /opt/airflow
    # Inside Docker, the database host is the service name "postgres" (not
    # localhost), so that is the default. My .env can say DB_HOST=localhost for
    # scripts I run directly from my own machine, without breaking the containers.
    # For the cloud setup (docs/azure_deployment.md) I set DOCKER_DB_HOST in .env
    # to the Azure PostgreSQL address; the Airflow metadata DB stays on "postgres".
    DB_HOST: ${DOCKER_DB_HOST:-postgres}
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-fpl_db}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
  volumes:
    # I mount local directories into the container so I can edit code or DAGs
    # locally and see the changes immediately without rebuilding the image.
    # (requirements.txt is not mounted: it is baked into the image at build time.)
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-fpl_db}
    ports:
      # Left side = port on MY machine (what DBeaver connects to). If I already
      # have a local Postgres on 5432, I set POSTGRES_HOST_PORT=5433 in .env.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # I mount the entire SQL folder and the init script.
      # This allows the init script to execute all my Bronze, Silver, and Gold
      # table creations automatically on the first startup.
      # Note: Postgres only runs these init files when the data volume is EMPTY
      # (first start). To re-run them: docker compose down -v  (this deletes the data!)
      - ./sql:/docker-entrypoint-initdb.d/sql
      - ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      # CMD-SHELL + $$ lets the check use the container's own env variables,
      # so it stays correct if I change the user/db name in .env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # I initialize the Airflow metadata database and create the admin user.
        # "db migrate" replaces "db init", which is deprecated since Airflow 2.7.
        airflow db migrate
        airflow users create \
            --username admin \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com \
            --password admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
