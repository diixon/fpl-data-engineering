# I use YAML anchors (x-airflow-common) to define the base configuration once, 
# instead of repeating the same environment variables and volumes for the 
# webserver, scheduler, and init containers.
x-airflow-common: &airflow-common
  # I build a custom image from my Dockerfile, instead of using the public 
  # apache/airflow image directly. This ensures my Python dependencies are 
  # installed inside the container.
  build: .
  image: fpl-airflow-custom:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fpl_user:fpl_password@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # I explicitly set a SECRET_KEY for the webserver. 
    # Why: Without this, the webserver cannot read logs generated by the scheduler, 
    # resulting in a 403 FORBIDDEN error when I try to view task logs in the UI.
    AIRFLOW__WEBSERVER__SECRET_KEY: 'a_very_long_and_random_secret_key_for_fpl_pipeline'
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: fpl_db
    DB_USER: fpl_user
    DB_PASSWORD: fpl_password
  volumes:
    # I mount local directories into the container so I can edit code or DAGs 
    # locally and see the changes immediately without rebuilding the image.
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
    - ./requirements.txt:/requirements.txt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fpl_user
      POSTGRES_PASSWORD: fpl_password
      POSTGRES_DB: fpl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # I mount the entire SQL folder and the init script. 
      # This allows the init script to execute all my Bronze, Silver, and Gold 
      # table creations automatically on the first startup.
      - ./sql:/docker-entrypoint-initdb.d/sql
      - ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fpl_user", "-d", "fpl_db"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # I initialize the Airflow metadata database and create the admin user.
        airflow db init
        airflow users create \
            --username admin \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com \
            --password admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume: